    <style>
      :root { color: #172033; background: #f4f7fb; font-family: Arial, sans-serif; }
      body { margin: 0; padding: 24px; }
      main { width: min(1240px, 100%); margin: 0 auto; }
      a { color: #002060; font-weight: 700; }
      .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 18px; }
      .panel { background: #fff; border: 1px solid #d9e2ef; border-radius: 8px; padding: 18px; box-shadow: 0 16px 38px #1b2a4a12; }
      .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
      select, button { border: 1px solid #c7d4e7; border-radius: 8px; font: inherit; padding: 10px 12px; }

      button { background: #002060; color: #fff; border-color: #002060; font-weight: 800; cursor: pointer; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 18px 0; }
      .card { border: 1px solid #e5edf7; border-radius: 8px; background: #f8fbff; padding: 14px; }
      .card strong { display: block; color: #002060; font-size: 28px; }
      .status { color: #475467; white-space: pre-wrap; }
      .status-offset { margin-top: 12px; }
      .result-panel { margin-top: 18px; }
      .is-hidden { display: none; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; background: #fff; }
      th, td { text-align: left; border-bottom: 1px solid #e5edf7; padding: 10px; vertical-align: top; }
      th { color: #002060; font-size: 13px; text-transform: uppercase; }
      .badge { display: inline-block; border-radius: 999px; background: #eaf1ff; color: #002060; padding: 3px 8px; font-size: 12px; font-weight: 800; }
      .danger { background: #fee4e2; color: #b42318; }
      @media (max-width: 760px) { body { padding: 14px; } .toolbar, .topbar { display: grid; } button { width: 100%; } }
    </style>

  <body>
    <main>
      <div class="topbar">
        <div>
          <h1>Monitor XML</h1>
          <p class="status">Resumo de XML 001-004, alarmes e parametros fora de referencia por importacao.</p>
        </div>
        <nav><a href="/">Aplicacao</a> &nbsp; <a href="/carga-pasta">Carga por pasta</a></nav>
      </div>
      <section class="panel">
        <div class="toolbar">
          <label>
            Importacao
            <select id="batchSelect"><option value="">Carregando...</option></select>
          </label>
          <button id="loadMonitor" type="button">Abrir monitor</button>
        </div>
        <div id="status" class="status status-offset">Selecione uma importacao.</div>
      </section>
      <section id="result" class="panel result-panel is-hidden"></section>
    </main>
    <script>
      const batchSelect = document.getElementById('batchSelect');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const request = async (path, options) => {
        const response = await fetch(`/api${path}`, options);
        const payload = await response.json().catch(() => null);
        if (!response.ok) throw new Error(payload?.detail || 'Falha na requisicao.');
        return payload;
      };
      const statusClass = (value) => value === 'out_of_reference' || value === 'changed_without_reference' ? 'badge danger' : 'badge';
      const renderRows = (items, columns) => items.map((item) => `<tr>${columns.map((column) => `<td>${column(item)}</td>`).join('')}</tr>`).join('');
      const renderMonitor = (monitor) => {
        const totals = monitor.totals || {};
        const parameters = (monitor.parameters || []).filter((item) => item.changed || item.validation_status !== 'ok').slice(0, 200);
        const alarms = (monitor.alarms || []).slice(0, 200);
        result.classList.remove('is-hidden');
        result.innerHTML = `
          <h2>${escapeHtml(monitor.batch_name)}</h2>
          <div class="cards">
            ${Object.entries(totals).map(([key, value]) => `<div class="card"><strong>${value}</strong><span>${escapeHtml(key.replaceAll('_', ' '))}</span></div>`).join('')}
          </div>
          <h3>Parametros alterados ou fora de referencia</h3>
          ${parameters.length ? `<table><thead><tr><th>Arquivo</th><th>CV/Tag</th><th>Parametro</th><th>Atual</th><th>Referencia</th><th>Status</th></tr></thead><tbody>${renderRows(parameters, [
            (item) => escapeHtml(item.source_file_name),
            (item) => `${escapeHtml(item.cv_id)}<br>${escapeHtml(item.tag)}`,
            (item) => escapeHtml(item.parameter_label || item.parameter_key),
            (item) => escapeHtml(item.current_value),
            (item) => escapeHtml(item.reference_value),
            (item) => `<span class="${statusClass(item.validation_status)}">${escapeHtml(item.validation_status)}</span><br><small>${escapeHtml(item.validation_message)}</small>`
          ])}</tbody></table>` : '<p class="status">Nenhum parametro critico encontrado.</p>'}
          <h3>Alarmes e eventos</h3>
          ${alarms.length ? `<table><thead><tr><th>Quando</th><th>Origem</th><th>Alarme</th><th>Status</th><th>Gestao</th></tr></thead><tbody>${renderRows(alarms, [
            (item) => escapeHtml(item.occurred_at ? new Date(item.occurred_at).toLocaleString() : ''),
            (item) => `${escapeHtml(item.source_document)}<br>${escapeHtml(item.cv_id)} / ${escapeHtml(item.tag)}`,
            (item) => escapeHtml(item.alarm_text),
            (item) => `<span class="${item.severity === 'critical' ? 'badge danger' : 'badge'}">${escapeHtml(item.priority || item.severity)}</span>`,
            (item) => escapeHtml(item.management?.management_status || '')
          ])}</tbody></table>` : '<p class="status">Nenhum alarme encontrado.</p>'}`;
      };
      const loadBatches = async () => {
        const batches = await request('/ingestion/batches');
        batchSelect.innerHTML = '<option value="">Selecione uma importacao</option>' + batches
          .map((batch) => `<option value="${batch.id}">#${batch.id} - ${escapeHtml(batch.source_name)}</option>`)
          .join('');
      };
      document.getElementById('loadMonitor').addEventListener('click', async () => {
        const batchId = batchSelect.value;
        if (!batchId) {
          status.textContent = 'Selecione uma importacao.';
          return;
        }
        status.textContent = 'Carregando monitor XML...';
        try {
          renderMonitor(await request(`/xml-monitor/batches/${batchId}`));
          status.textContent = 'Monitor carregado.';
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : 'Falha ao carregar monitor.';
        }
      });
      loadBatches().catch((error) => { batchSelect.innerHTML = '<option value="">Falha ao carregar</option>'; status.textContent = error.message; });
    </script>
  </body>
